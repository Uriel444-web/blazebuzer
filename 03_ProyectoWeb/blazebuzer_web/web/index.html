    <body>
       <!--<<div>

         <section class="vh-100">
        <div class="container-fluid h-custom">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-md-9 col-lg-6 col-xl-5">
                    <img src="img/blazeBuzerIcon.jpg"
                    class="img-fluid rounded-circle" alt="Sample image">
                </div>
                <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                    <form class="login-form">
                        <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start mb-4">
                            <p class="title">BlazeBuzer</p>
                        </div>
                        <!-- Email input -->
                        <div class="form-outline mb-4">
                            <input type="email" id="txtUsuario" class="form-control form-control-lg"
                                   placeholder="Ingresar username"/>
                            <label class="form-label" for="form3Example3">User</label>
                        </div>
                        <!-- Password input -->
                        <div class="form-outline mb-3">
                            <input type="password" id="txtPassword" class="form-control form-control-lg"
                                   placeholder="Ingresar contraseña"/>
                            <label class="form-label" for="form3Example4">Password</label>
                        </div>
                        
                        <div class="text-center text-lg-start mt-4 pt-2">
                            <button type="button" class="btn btn-primary btn-lg" id="btnLogIn" style="padding-left: 2.5rem; padding-right: 2.5rem;">Login</button>
                            <p class="small fw-bold mt-2 pt-1 mb-0">No tienes una cuenta? <a href="#!" class="link-danger">Registrar</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
